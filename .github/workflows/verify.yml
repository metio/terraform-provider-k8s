name: Verify
on:
  merge_group:
  pull_request:
    branches: [main]
permissions:
  contents: read
  checks: read

jobs:
  go:
    name: Golang
    uses: metio/ci/.github/workflows/golang.yml@00adafd0fe1924f57325d9dd264d5d731fb099ad # 2026.11.4082509
    with:
      packages: ./internal/... ./tools/...
      test-timeout-minutes: 60
      lint-timeout-minutes: 30
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: metio/ci/breto@00adafd0fe1924f57325d9dd264d5d731fb099ad # 2026.11.4082509
        with:
          registries: github:metio/toolchains
      - name: Generate the documentation
        run: go generate ./tools/docs.go
      - name: Fail on stale documentation
        run: |
          git diff --compact-summary --exit-code ||
            { echo "::error::The documentation is stale. Run 'make docs' and commit the result."; exit 1; }
      - name: Wait for the other checks
        if: github.event_name == 'pull_request'
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          running-workflow-name: Documentation
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
  verify:
    name: Verify
    needs: [go, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
