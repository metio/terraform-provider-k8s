name: FlowcontrolApiserverK8SIoFlowSchemaV1Beta2Manifest
on:
  pull_request:
    branches: [ main ]
    paths:
      - examples/data-sources/k8s_flowcontrol_apiserver_k8s_io_flow_schema_v1beta2_manifest/**
      - internal/provider/flowcontrol_apiserver_k8s_io_v1beta2/flowcontrol_apiserver_k8s_io_flow_schema_v1beta2_manifest.go
      - internal/provider/flowcontrol_apiserver_k8s_io_v1beta2/flowcontrol_apiserver_k8s_io_flow_schema_v1beta2_manifest_test.go
      - terratest/flowcontrol_apiserver_k8s_io_v1beta2/flowcontrol_apiserver_k8s_io_flow_schema_v1beta2_manifest_test.go
permissions:
  contents: read

jobs:
  terraform:
    name: Test with Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: setup_go
        name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - id: setup_terraform
        name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - id: install
        name: Install Provider
        run: make install
      - id: tests
        name: Run Unit Tests
        run: go test -v -timeout=120s -count=1 ./internal/provider/flowcontrol_apiserver_k8s_io_v1beta2/flowcontrol_apiserver_k8s_io_flow_schema_v1beta2_manifest_test.go
      - id: terratest
        name: Run Terratest Tests
        run: go test -v -timeout=120s -count=1 -run TestFlowcontrolApiserverK8SIoFlowSchemaV1Beta2Manifest ./terratest/flowcontrol_apiserver_k8s_io_v1beta2
