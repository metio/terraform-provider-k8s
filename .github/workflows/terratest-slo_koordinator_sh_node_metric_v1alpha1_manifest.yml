name: SloKoordinatorShNodeMetricV1Alpha1Manifest
on:
  pull_request:
    branches: [ main ]
    paths:
      - examples/data-sources/k8s_slo_koordinator_sh_node_metric_v1alpha1_manifest/**
      - internal/provider/slo_koordinator_sh_v1alpha1/slo_koordinator_sh_node_metric_v1alpha1_manifest.go
      - internal/provider/slo_koordinator_sh_v1alpha1/slo_koordinator_sh_node_metric_v1alpha1_manifest_test.go
      - terratest/slo_koordinator_sh_v1alpha1/slo_koordinator_sh_node_metric_v1alpha1_manifest_test.go
permissions:
  contents: read

jobs:
  terraform:
    name: Test with Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: setup_go
        name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - id: setup_terraform
        name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - id: install
        name: Install Provider
        run: make install
      - id: tests
        name: Run Unit Tests
        run: go test -v -timeout=120s -count=1 ./internal/provider/slo_koordinator_sh_v1alpha1/slo_koordinator_sh_node_metric_v1alpha1_manifest_test.go
      - id: terratest
        name: Run Terratest Tests
        run: go test -v -timeout=120s -count=1 -run TestSloKoordinatorShNodeMetricV1Alpha1Manifest ./terratest/slo_koordinator_sh_v1alpha1
